version: '3.8'

services:
  orchestrator:
    build: ./microservices/orchestrator
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user:3001
      - TOUR_SERVICE_URL=http://tour:3002
      - BOOKING_SERVICE_URL=http://booking:3003
      - PAYMENT_SERVICE_URL=http://payment:3004
      - NOTIFICATION_SERVICE_URL=http://notification:3005
    depends_on:
      - user
      - tour
      - booking
      - payment
      - notification

  user:
    build: ./microservices/user
    ports:
      - "3001:3001"
    environment:
      - PORT=3001

  tour:
    build: ./microservices/tour
    ports:
      - "3002:3002"
    environment:
      - PORT=3002

  booking:
    build: ./microservices/booking
    ports:
      - "3003:3003"
    environment:
      - PORT=3003

  payment:
    build: ./microservices/payment
    ports:
      - "3004:3004"
    environment:
      - PORT=3004

  notification:
    build: ./microservices/notification
    ports:
      - "3005:3005"
    environment:
      - PORT=3005

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - orchestrator
