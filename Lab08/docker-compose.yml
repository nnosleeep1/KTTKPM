version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  seed:
    build: ./seed
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    restart: "no"

  pu1-product:
    build: ./pu1-product
    ports:
      - "8081:8081"
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped

  pu2-cart:
    build: ./pu2-cart
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped

  pu3-order:
    build: ./pu3-order
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - INVENTORY_URL=http://pu4-inventory:8084
    restart: unless-stopped

  pu4-inventory:
    build: ./pu4-inventory
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  redis_data:
